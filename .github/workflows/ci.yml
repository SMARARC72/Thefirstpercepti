name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build:packages

      - name: Audit Tide-Stained glyph discipline (no emoji in apps/web)
        run: npm run audit:glyphs

      - name: Verify generated types are in sync with schema
        run: npm run gen:types:check

      - name: Typecheck
        run: npm run typecheck

      - name: Compile narrative content
        run: npm run content:compile

      - name: Validate Ink scene routing
        run: npm run content:validate

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm --prefix apps/web run build

      - name: Bundle budget gate
        run: npm run bundle:check

      - name: Install Playwright browsers
        run: npx --prefix apps/web playwright install --with-deps chromium

      - name: Run Playwright smoke
        run: npm run test:e2e
